name: Release (JSR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        shell: bash
        env:
          JSR_TOKEN: ${{ secrets.JSR_TOKEN }}
        run: |
          set +e
          deno publish --token "$JSR_TOKEN" > /tmp/jsr-publish.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            tail_out=$(tail -15 /tmp/jsr-publish.log | tr '\n' '|' | cut -c1-1500)
            echo "::error::JSRLOG ${tail_out}"
          fi
          exit "$status"
