name: Release (JSR)

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to JSR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Publish to JSR
        shell: bash
        run: |
          set +e
          deno publish > /tmp/jsr-publish.log 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::JSRLOG $(tail -20 /tmp/jsr-publish.log | tr '\n' '|' | cut -c1-2000)"
          fi
          exit "$status"
